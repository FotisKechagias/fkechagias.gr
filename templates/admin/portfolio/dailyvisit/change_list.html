{% extends "admin/change_list.html" %}

{% block content %}
{% if visit_chart %}
<div style="margin: 0 0 24px; padding: 18px 20px; background: #17171d; border-radius: 12px;">
  <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px;">
    <strong style="color: #f5f5f7; font-size: 14px;">Τελευταίες 14 ημέρες</strong>
    <span style="color: #a1a1a6; font-size: 12px;">Σύνολο: {{ visit_sum }} επισκέψεις</span>
  </div>
  <div style="display: flex; align-items: flex-end; gap: 6px; height: 110px;">
    {% for c in visit_chart %}
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end;"
         title="{{ c.date|date:'d/m' }}: {{ c.total }} επισκέψεις">
      <span style="color: #a1a1a6; font-size: 10px;">{{ c.total }}</span>
      <div style="width: 100%; max-width: 34px; border-radius: 4px 4px 0 0; background: #7d8ff4;
                  height: {% if c.pct > 0 %}{{ c.pct }}%{% else %}2px{% endif %};
                  {% if c.total == 0 %}background: #33343c;{% endif %}"></div>
      <span style="color: #6f7076; font-size: 9px;">{{ c.date|date:'d/m' }}</span>
    </div>
    {% endfor %}
  </div>
</div>
{% endif %}
{{ block.super }}
{% endblock %}
