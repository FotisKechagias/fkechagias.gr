<!DOCTYPE html>
<!-- Αυτόνομη σελίδα (χωρίς extends): σε server error δεν πρέπει να
     εξαρτόμαστε από templates/context που ίσως είναι η αιτία του 500. -->
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>500 — Κάτι πήγε στραβά · FKECHAGIAS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101012;
      color: #e8e8ea;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      padding: 24px;
    }
    .code {
      display: block;
      font-size: 15px;
      letter-spacing: 0.3em;
      color: #a1a1a6;
      margin-bottom: 18px;
    }
    h1 { font-size: clamp(28px, 6vw, 48px); font-weight: 700; letter-spacing: -0.03em; color: #f5f5f7; margin-bottom: 14px; }
    p { color: #a1a1a6; line-height: 1.7; max-width: 420px; margin: 0 auto 28px; }
    a {
      display: inline-block;
      background: #6e85d6;
      color: #0b0e17;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 13px 28px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div>
    <span class="code">ERROR 500</span>
    <h1>Κάτι πήγε στραβά.</h1>
    <p>Προσωρινό τεχνικό πρόβλημα — δοκιμάστε ξανά σε λίγο.
       Αν επιμένει, στείλτε μου μήνυμα στο fkechagias07@gmail.com.</p>
