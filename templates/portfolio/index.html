{% load static vite_tags %}
<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />

  <title>FKECHAGIAS — Web Design &amp; Development</title>
  <meta name="description" content="Freelance web design &amp; development. Ιστοσελίδες που ξεχωρίζουν, χτισμένες από το μηδέν, χωρίς templates." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{% static 'images/logo.svg' %}" />
  <link rel="apple-touch-icon" href="{% static 'images/logo.svg' %}" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="FKECHAGIAS — Web Design & Development" />
  <meta property="og:description" content="Ιστοσελίδες που ξεχωρίζουν, χτισμένες από το μηδέν." />
  <meta property="og:url" content="https://fkechagias.gr" />
  <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'images/logo.svg' %}" />

  <!-- Fonts: Almarai (global) + Instrument Serif italic (accent) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Instrument+Serif:ital@1&display=swap"
    rel="stylesheet"
  />

  {% vite_asset 'src/main.tsx' %}
</head>
<body class="bg-black">
  <div id="root"></div>
</body>
</html>
